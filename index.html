<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>シンワ予定</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><link rel="stylesheet" href="./app.css?v=20260812-1825"></head><body>
<div id="boot" class="center">起動中…</div>
<section id="auth" class="center hide"><div class="auth card"><div class="eyebrow">SHINWA · 静岡営業所</div><h1>シンワ予定</h1>
<form id="login" class="stack"><p>会社で登録されたアカウントでログインします。</p><label>メールアドレス<input id="le" type="email" autocomplete="username" required></label><label>パスワード<input id="lp" type="password" autocomplete="current-password" required></label><button class="btn">ログイン</button><button type="button" id="goSignup" class="sub">初めて使う方はこちら</button><div id="lm" class="err"></div></form>
<form id="signup" class="stack hide"><p><b>初回登録</b><br>管理者から届いた招待URLから、本人用のパスワードを設定します。</p><label>登録済みメールアドレス<input id="se" type="email" autocomplete="username" required></label><label>新しいパスワード<input id="sp" type="password" minlength="8" autocomplete="new-password" required></label><label>パスワード確認<input id="sp2" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn">アカウントを有効化</button><button type="button" id="goLogin" class="sub">ログインに戻る</button><div id="sm"></div></form>
</div></section>
<div id="app" class="hide"><header><div><div class="eyebrow">静岡営業所</div><h1>シンワ予定</h1></div><button id="acct" class="pill">—</button></header><main>
<section id="home" class="view"><div class="bar"><div><b id="dateLabel"></b><small id="summary" style="display:block;color:#6b7280"></small></div><div><button id="mine" class="mini on">自分</button><button id="all" class="mini">全員</button></div></div><h2>今日</h2><div id="today" class="cards"></div><h2>明日</h2><div id="tomorrow" class="cards"></div><h2>この先</h2><div id="future" class="list"></div></section>
<section id="cal" class="view hide"><div class="bar"><button id="prev" class="mini">‹</button><h2 id="month" style="margin:0"></h2><button id="next" class="mini">›</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="grid" class="grid"></div><div id="dayList"></div></section>
<section id="manage" class="view hide"><div class="bar"><h2 style="margin:0">予定管理</h2><button id="new" class="btn">＋予定追加</button></div><div id="manageList" class="list"></div></section></main><nav><button class="nav on" data-v="home">⌂<small>予定</small></button><button class="nav" data-v="cal">▦<small>カレンダー</small></button><button id="manageNav" class="nav" data-v="manage">✎<small>管理</small></button></nav></div>
