<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>セントログ 更新</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{text-align:center;padding:24px}strong{font-size:20px}p{opacity:.78;line-height:1.6;font-size:14px}
</style>
</head>
<body>
<main><strong>セントログを更新しています</strong><p>端末内の案件・図面データは消しません。<br>数秒で最新版を開きます。</p></main>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>String(r.scope||'').includes('/sentlog/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('sentlog-')).map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace('./?fresh=20260925-1');
})();
</script>
</body>
</html>
