name: Patch future schedule groups

on:
  push:
    paths:
      - '.github/workflows/patch-future-groups.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply grouping patch
        run: python .github/patch-future-groups.py
      - name: Check JavaScript
        run: node --check app.js
      - name: Commit changes
        run: |
          git config user.name "ichikawa7312"
          git config user.email "ichikawa7312@gmail.com"
          git add app.js app.css index.html sw.js
          git commit -m "Group future schedules by date"
          git push
