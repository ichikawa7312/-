name: Lossless PDF export speed checks
on:
  push:
    branches: [sentlog-v191-fast-export]
  pull_request:
    paths: ['scripts/build_export_speed.py', 'scripts/build_drawing_export.py', 'tests/drawing_export_speed*', '.github/workflows/export-speed-check.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      SENTLOG_EXPORT_BASELINE_DIR: /tmp/sentlog-export-baseline
      SENTLOG_TEST_BROWSERS: chromium,webkit
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install fonttools==4.61.1 playwright==1.57.0 reportlab==4.4.9 pypdf==6.10.0 pymupdf==1.26.3 pillow==11.3.0
          python -m playwright install --with-deps chromium webkit
      - name: Build and run the existing release checks
        run: |
          python - <<'PY'
          import pathlib, subprocess
          lines=pathlib.Path('.github/workflows/pages.yml').read_text().splitlines()
          commands=[];active=False
          for line in lines:
              if line=='        run: |':
                  active=True
              elif active and line.startswith('          '):
                  command=line[10:].strip()
                  if command: commands.append(command)
              elif active and line.strip():
                  break
          assert len(commands)>80, 'Unexpected release workflow; no checks skipped'
          for command in commands:
              print('RUN',command,flush=True)
              subprocess.run(command,shell=True,check=True,timeout=240)
          PY
      - name: Existing PDF, image, DXF, folder and cancellation browser checks
        run: python tests/drawing_export_ui.py
      - name: Compare old and new PDFs, fine detail and timing
        run: python tests/drawing_export_speed_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-speed-quality-results
          path: test-results
