name: Sentlog archive checks
on:
  push:
    branches: [sentlog-archive-v133, sentlog-archive-v134, sentlog-management-v135, sentlog-registration-v136, sentlog-capacity-v137, sentlog-capacity-v138, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/build_archive.py
          python scripts/build_management.py
          python scripts/build_capacity.py
          python scripts/build_resilience.py
          python scripts/build_photo_recovery.py
          python scripts/build_shape_move.py
          python scripts/build_instant_damage_type.py
          python scripts/build_compact_labels.py
          python scripts/build_overview_labels.py
          python scripts/build_polygon_snap.py
          python scripts/build_polygon_dimensions.py
          python scripts/build_damage_catalog.py
          python scripts/build_toolbar_icons.py
          python scripts/build_toolbar_help.py
          python scripts/build_damage_styles.py
          python scripts/build_label_colors.py
          python scripts/build_plain_numbers.py
          python scripts/build_single_number_ui.py
          python scripts/build_optional_symbol_ui.py
          python scripts/build_image_recovery_view.py
          python scripts/build_large_image_view.py
          python scripts/build_image_memory.py
          python scripts/build_image_viewport.py
          python scripts/build_original_photos.py
          python scripts/build_crack_width.py
          python scripts/build_field_records.py
          python scripts/build_short_photo_arrow.py
          python scripts/build_photo_label_position.py
          python scripts/build_field_record_move.py
          python scripts/build_record_inspector_fix.py
          python scripts/build_drawing_list_actions.py
          python scripts/build_editor_drawing_add.py
          python scripts/build_drawing_groups.py
          python scripts/build_group_sync_migration.py
          python scripts/build_dimension_lines.py
      - run: |
          node --check sentlog/archive.js
          node --check sentlog/archive-core.js
          node --check sentlog/archive-pc.js
          node --check sentlog/cloud-sync.js
          node --check sentlog/pdf-recovery.js
          node --check sentlog/management.js
          node --check sentlog/archive-capacity.js
          node --check sentlog/archive-restore-pc.js
          node --check sentlog/photo-recovery.js
          node --check sentlog/shape-move.js
          node --check sentlog/polygon-dimensions.js
          node --check sentlog/damage-catalog.js
          node --check sentlog/toolbar-icons.js
          node --check sentlog/damage-styles.js
          node --check sentlog/label-colors.js
          node --check sentlog/capacity-details.js
          node --check sentlog/record-store.js
          node --check sentlog/inspector-interaction.js
          node --check sentlog/sync-view.js
          node --check sentlog/image-quality.js
          node --check sentlog/original-photo-store.js
          node --check sentlog/crack-width.js
          node --check sentlog/field-records.js
          node --check sentlog/drawing-list-actions.js
          node --check sentlog/editor-drawing-add.js
          node --check sentlog/drawing-groups.js
          node --check sentlog/dimension-lines.js
          node tests/image_recovery_view.test.cjs
          node tests/large_image_view.test.cjs
          node tests/original_photo_store.test.cjs
          node tests/crack_width.test.cjs
          node tests/field_records.test.cjs
          node tests/drawing_list_actions.test.cjs
          node tests/editor_drawing_add.test.cjs
          node tests/drawing_groups.test.cjs
          node tests/group_sync_migration.test.cjs
          node tests/dimension_lines.test.cjs
          node tests/core.test.cjs
          node tests/pc.test.cjs
          node tests/integration.test.cjs
          node tests/management.test.cjs
          node tests/capacity.test.cjs
          node tests/capacity_pc.test.cjs
          node tests/resilience.test.cjs
          node tests/resilience_pc.test.cjs
          node tests/photo_recovery_pc.test.cjs
          node tests/photo_delivery_guard.test.cjs
          node tests/leader_line_width.test.cjs
          node tests/shape_move.test.cjs
          node tests/instant_damage_type.test.cjs
          node tests/compact_labels.test.cjs
          node tests/polygon_snap.test.cjs
          node tests/polygon_dimensions.test.cjs
          node tests/damage_catalog.test.cjs
          node tests/toolbar_icons.test.cjs
          node tests/toolbar_help.test.cjs
          node tests/damage_styles.test.cjs
          node tests/label_colors.test.cjs
          node tests/plain_numbers.test.cjs
          node tests/single_number_ui.test.cjs
          node tests/optional_symbol_ui.test.cjs
      - run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
          python tests/image_memory_ui.py
          python tests/original_photo_ui.py
          python tests/crack_width_ui.py
          python tests/field_records_ui.py
          python tests/drawing_list_actions_ui.py
          python tests/editor_drawing_add_ui.py
          python tests/drawing_groups_ui.py
          python tests/ui.py
          python tests/archive_click.py
          python tests/full_archive_click.py
          python tests/full_management.py
          python tests/capacity_ui.py
          python tests/photo_recovery_ui.py
          python tests/large_image_view_ui.py
          python tests/shape_move_ui.py
          python tests/instant_damage_type_ui.py
          python tests/overview_labels_ui.py
          python tests/polygon_snap_ui.py
          python tests/polygon_dimensions_ui.py
          python tests/damage_catalog_ui.py
          python tests/toolbar_icons_ui.py
          python tests/toolbar_help_ui.py
          python tests/damage_styles_ui.py
          python tests/label_colors_ui.py
          python tests/plain_numbers_ui.py
          python tests/single_number_ui.py
          python tests/optional_symbol_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-ui-checks
          path: test-results
