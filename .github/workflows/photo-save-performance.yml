name: Photo save performance and durability
on:
  pull_request:
    paths:
      - '.github/workflows/photo-save-performance.yml'
      - 'tests/photo_save_performance_ui.py'
      - 'sentlog/continuous-camera.js'
      - 'sentlog/collaboration-photos.js'
      - 'sentlog/original-photo-store.js'
      - 'sentlog/record-store.js'
      - 'sentlog/delta-sync-app-*.js'
      - 'scripts/build_continuous_camera.py'
      - 'scripts/build_delta_sync.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photo-save-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble@sha256:8331696befd3ee8b5baefca428446345f548e415a2408fe1d3d1224e9d919682
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
      - name: Checkout published baseline
        uses: actions/checkout@v6
        with:
          ref: f9a45102ff30ba70db57dbb77aea32532ffbcb61
          path: perf-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both complete production apps
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          for directory in ('perf-baseline', '.'):
              root=Path(directory).resolve()
              lines=(root/'.github/workflows/pages.yml').read_text().splitlines()
              marker='      - name: Build archive, management and capacity integration'
              assert lines.count(marker)==1
              start=lines.index(marker)+1
              assert lines[start].strip()=='run: |'
              commands=[]
              for line in lines[start+1:]:
                  if not line.startswith('          '):break
                  commands.append(line[10:])
              assert any('build_continuous_camera.py' in command for command in commands)
              assert any('build_delta_sync.py' in command for command in commands)
              subprocess.run(['bash','-e','-o','pipefail','-c','\n'.join(commands)],cwd=root,check=True)
          PY
      - name: Install matching browser test package
        run: python -m pip install playwright==1.57.0 pillow==11.3.0
      - name: Compare photo save work and native durability
        run: python tests/photo_save_performance_ui.py --engine ${{ matrix.engine }} --built-root . --baseline-root perf-baseline --report /tmp/photo-save-performance-${{ matrix.engine }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-save-performance-${{ matrix.engine }}
          path: /tmp/photo-save-performance-${{ matrix.engine }}.json
          if-no-files-found: ignore
