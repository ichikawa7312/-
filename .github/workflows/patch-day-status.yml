name: Patch daily staff status

on:
  push:
    paths:
      - '.github/workflows/patch-day-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch daily staff status
        shell: python
        run: |
          from pathlib import Path

          p = Path('app.js')
          t = p.read_text(encoding='utf-8')

          old = "let session,me,staff=[],schedules=[],members=[],confs=[],deps=[],dm=[];"
          new = "let session,me,staff=[],schedules=[],members=[],confs=[],deps=[],dm=[],dayStatus=[];"
          assert old in t
          t = t.replace(old, new, 1)

          old = "    db.from('departure_members').select('*')\n  ]);"
          new = "    db.from('departure_members').select('*'),\n    db.from('staff_day_status').select('*')\n  ]);"
          assert old in t
          t = t.replace(old, new, 1)

          old = "  [staff,schedules,members,confs,deps,dm]=rs.map(r=>r.data||[]);"
          new = "  [staff,schedules,members,confs,deps,dm,dayStatus]=rs.map(r=>r.data||[]);"
          assert old in t
          t = t.replace(old, new, 1)

          marker = "function visible(){return schedules.filter(s=>!onlyMine||assigned(s))}"
          assert marker in t
          block = r'''function dayStatusHtml(date){
  const offIds=new Set(dayStatus.filter(x=>x.work_date===date&&x.status==='off').map(x=>x.staff_id));
  const scheduledIds=new Set();
  schedules.filter(s=>s.work_date===date).forEach(s=>sm(s).forEach(x=>scheduledIds.add(x.staff_id)));
  const overlap=staff.filter(p=>offIds.has(p.id)&&scheduledIds.has(p.id));
  const off=staff.filter(p=>offIds.has(p.id));
  const site=staff.filter(p=>scheduledIds.has(p.id)&&!offIds.has(p.id));
  const office=staff.filter(p=>!scheduledIds.has(p.id)&&!offIds.has(p.id));
  const names=xs=>xs.length?xs.map(x=>esc(x.display_name)).join('・'):'なし';
  return `<div class="box" style="margin-bottom:10px">
    <div class="boxhead"><b>勤務状況</b><span style="font-size:11px;color:#6b7280">全${staff.length}名</span></div>
    <div style="margin-top:7px"><b>現場 ${site.length}名</b><div style="font-size:12px;color:#4b5563;margin-top:2px">${names(site)}</div></div>
    <div style="margin-top:7px"><b>事務所 ${office.length}名</b><div style="font-size:12px;color:#4b5563;margin-top:2px">${names(office)}</div></div>
    <div style="margin-top:7px"><b>休み ${off.length}名</b><div style="font-size:12px;color:#4b5563;margin-top:2px">${names(off)}</div></div>
    ${overlap.length?`<div style="margin-top:8px;padding:7px;border-radius:8px;background:#fff7ed;font-size:11px"><b>⚠ 休みと現場予定が重複：</b>${names(overlap)}</div>`:''}
  </div>`;
}

'''
          t = t.replace(marker, block + marker, 1)

          old = "  $('today').innerHTML=t.length?t.map(job).join(''):'<div class=\"empty\">今日の予定はありません</div>';"
          new = "  $('today').innerHTML=dayStatusHtml(D0)+(t.length?t.map(job).join(''):'<div class=\"empty\">今日の現場予定はありません</div>');"
          assert old in t
          t = t.replace(old, new, 1)

          old = "  $('tomorrow').innerHTML=tm.length?tm.map(job).join(''):'<div class=\"empty\">明日の予定はありません</div>';"
          new = "  $('tomorrow').innerHTML=dayStatusHtml(D1)+(tm.length?tm.map(job).join(''):'<div class=\"empty\">明日の現場予定はありません</div>');"
          assert old in t
          t = t.replace(old, new, 1)

          old = "  $('dayList').innerHTML=`<h2>${selected}</h2><div class=\"cards\">${xs.length?xs.map(job).join(''):'<div class=\"empty\">予定なし</div>'}</div>`;"
          new = "  $('dayList').innerHTML=`<h2>${selected}</h2><div class=\"cards\">${dayStatusHtml(selected)}${xs.length?xs.map(job).join(''):'<div class=\"empty\">現場予定なし</div>'}</div>`;"
          assert old in t
          t = t.replace(old, new, 1)

          marker = "function edit(id){"
          assert marker in t
          block = r'''function offChecks(date){
  const ids=new Set(dayStatus.filter(x=>x.work_date===date&&x.status==='off').map(x=>x.staff_id));
  return staff.map(p=>`<label class="ck"><input type="checkbox" name="offstaff" value="${p.id}" ${ids.has(p.id)?'checked':''}><span>${esc(p.display_name)}</span></label>`).join('');
}

function editOff(date=D1){
  if(!admin())return;
  modal('休み設定',`<form id="offForm" class="form">
    <label>日付<input id="offDate" type="date" value="${date}" required></label>
    <label>休みの人 <small style="color:#6b7280">（複数選択可）</small><div id="offStaff" class="staff">${offChecks(date)}</div></label>
    <small style="color:#6b7280">現場予定にも休み設定にも入っていない人は、自動的に「事務所」になります。</small>
    <button class="btn">保存</button>
  </form>`);
  $('offDate').onchange=()=>{$('offStaff').innerHTML=offChecks($('offDate').value)};
  $('offForm').onsubmit=saveOff;
}

async function saveOff(e){
  e.preventDefault();
  const date=$('offDate').value;
  const ids=[...document.querySelectorAll('input[name="offstaff"]:checked')].map(x=>x.value);
  let r=await db.from('staff_day_status').delete().eq('work_date',date);
  if(r.error)return toast('休み設定を保存できません');
  if(ids.length){
    r=await db.from('staff_day_status').insert(ids.map(staff_id=>({work_date:date,staff_id,status:'off',created_by:me.id})));
    if(r.error)return toast('休み設定を保存できません');
  }
  closeM();
  await refresh();
  toast(ids.length?`${ids.length}名を休みに設定しました`:'休み設定を解除しました');
}

'''
          t = t.replace(marker, block + marker, 1)

          old = "$('new').onclick=()=>edit();"
          new = "$('new').onclick=()=>edit();$('off').onclick=()=>editOff();"
          assert old in t
          t = t.replace(old, new, 1)

          p.write_text(t, encoding='utf-8')

          idx = Path('index.html')
          t = idx.read_text(encoding='utf-8')
          old = '<section id="manage" class="view hide"><div class="bar"><h2 style="margin:0">予定管理</h2><button id="new" class="btn">＋予定追加</button></div><div id="manageList" class="list"></div></section>'
          new = '<section id="manage" class="view hide"><div class="bar"><h2 style="margin:0">予定管理</h2><div style="display:flex;gap:6px"><button id="off" class="sub">休み設定</button><button id="new" class="btn">＋予定追加</button></div></div><div id="manageList" class="list"></div></section>'
          assert old in t
          t = t.replace(old, new, 1)
          t = t.replace('20260812-1838','20260812-1845')
          idx.write_text(t, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t = t.replace("shinwa-yotei-v6","shinwa-yotei-v7")
          t = t.replace('20260812-1838','20260812-1845')
          sw.write_text(t, encoding='utf-8')
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/patch-day-status.yml
          git config user.name "ichikawa7312"
          git config user.email "ichikawa7312@gmail.com"
          git add app.js index.html sw.js .github/workflows/patch-day-status.yml
          git commit -m "Add automatic field office off daily status"
          git push
