name: Sentlog delta application browser integration
on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/sentlog-delta-application.yml'
      - 'scripts/build_*.py'
      - 'sentlog/delta-sync-*'
      - 'sentlog/record-store.js'
      - 'sentlog/backup-format.js'
      - 'sentlog/startup-backup-recovery.js'
      - 'sentlog/storage-restore.html'
      - 'sentlog/blob-sha256.js'
      - 'tools/blob-hash-runtime/**'
      - 'sentlog/record-collaboration.js'
      - 'sentlog/collaboration-sync-runtime.txt'
      - 'sentlog/session-guard.js'
      - 'tests/delta_app_*'
      - 'tests/delta_drawing_*'
      - 'tests/individual_sync_app.py'
      - 'tests/record_storage_scale_ui.py'
      - 'tests/record_storage_pressure_ui.py'
      - 'tests/record_storage_cache_boundary_ui.py'
      - 'tests/record_rescue_ui.py'
      - 'tests/record_startup_guard_ui.py'
      - 'tests/startup_backup_recovery.test.cjs'
      - 'tests/startup_backup_recovery_ui.py'
      - 'tests/cloud_normalization_noop.test.cjs'
      - 'tests/cloud_normalization_release.test.cjs'
      - 'tests/record_connection_lifecycle.test.cjs'
      - 'tests/storage_lifecycle_release.test.cjs'
      - 'tests/pdf_recovery_failure_gate.test.cjs'
      - 'tests/pdf_save_failure_release.test.cjs'
      - 'tests/photo_recovery_failure_gate.test.cjs'
      - 'tests/helpers/photo_recovery_fixture.cjs'
      - 'tests/delta_save_failure_gate.test.cjs'
      - 'tests/helpers/delta_photo_failure_fixture.cjs'
      - 'tests/cloud_asset_save_failure_gate.test.cjs'
      - 'tests/helpers/cloud_asset_failure_fixture.cjs'
      - 'tests/recovery_retry_release.test.cjs'
      - 'tests/photo_grid_layout_ui.py'
      - 'tests/fixtures/render_selected_photos_v205.js'
      - 'tests/asset_download_budget.test.cjs'
      - 'tests/sync_work_status.test.cjs'
      - 'sentlog/sync-work-status.js'
      - 'sentlog/bounded-asset-download.txt'
      - 'sentlog/project-sync-controls.txt'
      - 'tests/helpers/delta_recovery_fixture.cjs'
      - 'tests/pdf_recovery_budget.test.cjs'
      - 'tests/pdf_handover_guard.test.cjs'
      - 'tests/delta_capacity_app_flow.py'
      - 'tests/collaboration_ui.py'
      - 'tests/edit_sync_ui.py'
      - 'docs/sentlog-delta-*.sql'
      - 'db/*.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delta-application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble@sha256:8331696befd3ee8b5baefca428446345f548e415a2408fe1d3d1224e9d919682
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check the exact production app
        id: production_build
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/pages.yml').read_text().splitlines()
          marker='      - name: Build archive, management and capacity integration'
          assert lines.count(marker)==1
          start=lines.index(marker)+1
          assert lines[start].strip()=='run: |'
          commands=[]
          for line in lines[start+1:]:
              if not line.startswith('          '):break
              commands.append(line[10:])
          assert 'python3 scripts/build_delta_sync.py' in commands
          subprocess.run(['bash','-e','-o','pipefail','-c','\n'.join(commands)],check=True)
          PY
      - name: Install pinned browser and SQL adapters
        id: browser_adapters
        run: |
          python -m pip install playwright==1.57.0 pillow==11.3.0
          npm install --prefix "$RUNNER_TEMP/sentlog-app-test-deps" --ignore-scripts --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.17 fake-indexeddb@6.2.8
      - name: Verify bounded PDF recovery against the production build
        run: |
          NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" node tests/pdf_recovery_budget.test.cjs
          NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" node tests/pdf_handover_guard.test.cjs
      - name: Verify explicit drawing recovery preserves pending photo references
        run: |
          NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" node tests/delta_drawing_review_integration.test.cjs
          SENTLOG_BUILT_ROOT=. NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" node tests/delta_drawing_upload_guard.test.cjs
      - name: Verify drawing review and cancellation in the browser
        run: python tests/delta_drawing_review_ui.py --engine ${{ matrix.engine }}
      - name: Verify actual drawing review through SQL and native storage
        run: NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" python tests/delta_drawing_review_app.py --engine ${{ matrix.engine }} --built-root .
      - name: Verify scoped migration progress and isolated UI observers
        run: NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" node tests/delta_migration_progress.test.cjs
      - name: Verify native record storage at the observed scale without quota injection
        timeout-minutes: 3
        run: python tests/record_storage_scale_ui.py --engine ${{ matrix.engine }} --built-root .
      - name: Verify restored attachments and staging survive receive and browser restart
        timeout-minutes: 4
        run: python tests/record_storage_pressure_ui.py --engine ${{ matrix.engine }} --built-root .
      - name: Verify emergency rescue remains usable after native save failure
        timeout-minutes: 3
        run: python tests/record_rescue_ui.py --engine ${{ matrix.engine }} --built-root . --report /tmp/sentlog-delta-app-record-rescue/${{ matrix.engine }}.json
      - name: Verify startup protection preserves partial native records
        timeout-minutes: 3
        run: python tests/record_startup_guard_ui.py --engine ${{ matrix.engine }} --built-root . --report /tmp/sentlog-delta-app-startup-guard/${{ matrix.engine }}.json
      - name: Verify startup backup recovery preserves native data and resumes safely
        timeout-minutes: 3
        run: python tests/startup_backup_recovery_ui.py --engine ${{ matrix.engine }} --built-root . --report /tmp/sentlog-delta-app-startup-backup/${{ matrix.engine }}.json
      - name: Verify delayed photo reads preserve the native delete target
        timeout-minutes: 3
        run: python tests/photo_grid_layout_ui.py --engine ${{ matrix.engine }} --built-root . --report /tmp/sentlog-delta-app-photo-grid/${{ matrix.engine }}.json
      - name: Verify individual synchronization through real workers and native save waits
        run: NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" python tests/individual_sync_app.py --engine ${{ matrix.engine }} --built-root .
      - name: Verify two actual applications with native storage and real SQL
        run: NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" python tests/delta_app_ui.py --engine ${{ matrix.engine }} --built-root .
      - name: Compare native record commits with cache storage and reported usage boundaries
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' && steps.browser_adapters.outcome == 'success' }}
        timeout-minutes: 8
        run: python tests/record_storage_cache_boundary_ui.py --engine ${{ matrix.engine }} --built-root .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-application-${{ matrix.engine }}
          path: |
            /tmp/sentlog-delta-app-*
            /tmp/sentlog-individual-sync-app
          if-no-files-found: ignore
