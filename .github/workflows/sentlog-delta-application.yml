name: Sentlog delta application browser integration
on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/sentlog-delta-application.yml'
      - 'scripts/build_*.py'
      - 'sentlog/delta-sync-*'
      - 'sentlog/record-store.js'
      - 'sentlog/blob-sha256.js'
      - 'tools/blob-hash-runtime/**'
      - 'sentlog/record-collaboration.js'
      - 'sentlog/session-guard.js'
      - 'tests/delta_app_*'
      - 'tests/delta_drawing_*'
      - 'tests/helpers/delta_recovery_fixture.cjs'
      - 'tests/pdf_recovery_budget.test.cjs'
      - 'tests/delta_capacity_app_flow.py'
      - 'tests/collaboration_ui.py'
      - 'tests/edit_sync_ui.py'
      - 'docs/sentlog-delta-*.sql'
      - 'db/*.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delta-application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble@sha256:8331696befd3ee8b5baefca428446345f548e415a2408fe1d3d1224e9d919682
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check the exact production app
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/pages.yml').read_text().splitlines()
          marker='      - name: Build archive, management and capacity integration'
          assert lines.count(marker)==1
          start=lines.index(marker)+1
          assert lines[start].strip()=='run: |'
          commands=[]
          for line in lines[start+1:]:
              if not line.startswith('          '):break
              commands.append(line[10:])
          assert 'python3 scripts/build_delta_sync.py' in commands
          subprocess.run(['bash','-e','-o','pipefail','-c','\n'.join(commands)],check=True)
          PY
      - name: Install pinned browser and SQL adapters
        run: |
          python -m pip install playwright==1.57.0 pillow==11.3.0
          npm install --prefix "$RUNNER_TEMP/sentlog-app-test-deps" --ignore-scripts --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.17 fake-indexeddb@6.2.8
      - name: Verify bounded PDF recovery against the production build
        run: NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" node tests/pdf_recovery_budget.test.cjs
      - name: Verify explicit drawing recovery preserves pending photo references
        run: |
          NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" node tests/delta_drawing_review_integration.test.cjs
          SENTLOG_BUILT_ROOT=. NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" node tests/delta_drawing_upload_guard.test.cjs
      - name: Verify drawing review and cancellation in the browser
        run: python tests/delta_drawing_review_ui.py --engine ${{ matrix.engine }}
      - name: Verify actual drawing review through SQL and native storage
        run: NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" python tests/delta_drawing_review_app.py --engine ${{ matrix.engine }} --built-root .
      - name: Verify two actual applications with native storage and real SQL
        run: NODE_PATH="$RUNNER_TEMP/sentlog-app-test-deps/node_modules" python tests/delta_app_ui.py --engine ${{ matrix.engine }} --built-root .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-application-${{ matrix.engine }}
          path: /tmp/sentlog-delta-app-*
          if-no-files-found: ignore
