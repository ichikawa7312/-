name: Sentlog field memo preservation checks
on:
  push:
    branches: ['fix/field-memo-*']
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/field-memo-check.yml'
      - 'scripts/build_field_memo.py'
      - 'scripts/build_live_sync.py'
      - 'sentlog/field-records.js'
      - 'sentlog/sync-view.js'
      - 'tests/field_record_memo_ui.py'
      - 'tests/sync_live_editor.test.cjs'
      - 'tests/sync_merge.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: field-memo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble@sha256:8331696befd3ee8b5baefca428446345f548e415a2408fe1d3d1224e9d919682
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check the exact production app
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/pages.yml').read_text().splitlines()
          marker='      - name: Build archive, management and capacity integration'
          assert lines.count(marker)==1
          start=lines.index(marker)+1
          assert lines[start].strip()=='run: |'
          commands=[]
          for line in lines[start+1:]:
              if line.startswith('          '):
                  commands.append(line[10:])
              else:
                  break
          assert any('build_field_memo.py' in c for c in commands)
          assert len(commands)>90
          subprocess.run(['bash','-e','-o','pipefail','-c','\n'.join(commands)],check=True)
          PY
      - name: Install matching test package for the bundled browsers
        run: |
          python -m pip install playwright==1.57.0 pillow==11.3.0
      # frRecordMemo is now a read-only projection of shared comments. Exercise
      # the current composer, IME/caret, redraw and photo delivery through the
      # canonical two-device suite; the build above also checks durable drafts,
      # record/drawing binding and comment/photo undo+redo in collaboration_editor.test.cjs.
      - name: Test shared comment drafts and photo updates in Chromium
        run: python tests/collaboration_ui.py --engine chromium --built-root .
      - name: Test shared Japanese input and redraw in WebKit
        run: python tests/collaboration_ui.py --engine webkit --built-root .
