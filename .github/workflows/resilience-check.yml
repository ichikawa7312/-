name: Sentlog safety checks (production-equivalent build)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exactly the deployed Sentlog and run regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source=Path('.github/workflows/pages.yml').read_text(encoding='utf-8')
          start='      - name: Build archive, management and capacity integration\n        run: |\n'
          end='      - name: Setup Pages'
          if source.count(start)!=1 or source.count(end)!=1:
              raise RuntimeError('Production build anchors changed; safety checks cannot be skipped')
          block=source.split(start,1)[1].split(end,1)[0]
          lines=block.splitlines()
          if not lines or any(x.strip() and not x.startswith('          ') for x in lines):
              raise RuntimeError('Unexpected production build indentation')
          commands='\n'.join(x[10:] if x.strip() else '' for x in lines)+'\n'
          required=('python3 scripts/build_archive.py',
                    'python3 scripts/build_sync_merge.py',
                    'python3 scripts/build_pdf_revision_guard.py',
                    'python3 scripts/build_photo_ledger.py',
                    'node tests/pc.test.cjs',
                    'node tests/core.test.cjs',
                    'node tests/photo_ledger.test.cjs')
          for item in required:
              if item not in commands:
                  raise RuntimeError('Required safety check missing: '+item)
          subprocess.run(['bash','-e','-o','pipefail','-c',commands],check=True)
          PY
