name: Sentlog v1.39 safety checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build latest Sentlog without touching user data
        run: |
          python3 scripts/build_archive.py
          python3 scripts/build_management.py
          python3 scripts/build_capacity.py
          python3 scripts/build_resilience.py
      - name: Run regression tests
        run: |
          node tests/core.test.cjs
          node tests/pc.test.cjs
          node tests/integration.test.cjs
          node tests/management.test.cjs
          node tests/capacity.test.cjs
          node tests/capacity_pc.test.cjs
          node tests/resilience.test.cjs
          node tests/resilience_pc.test.cjs
      - name: Check browser script syntax
        run: |
          node --check sentlog/archive-capacity.js
          node --check sentlog/capacity-details.js
          node --check sentlog/archive-restore-pc.js
