name: Sentlog delta-sync prototype safety tests
on:
  pull_request:
    paths:
      - 'sentlog/delta-sync-*.js'
      - 'sentlog/delta-sync-*.txt'
      - 'sentlog/archive-core.js'
      - 'sentlog/record-collaboration.js'
      - 'scripts/build_delta_sync.py'
      - 'scripts/assemble_delta_sync.py'
      - 'scripts/build_capacity.py'
      - 'scripts/build_management.py'
      - 'docs/sentlog-delta-*.sql'
      - 'db/collaboration_v1.sql'
      - 'sentlog/photo-recovery.js'
      - 'sentlog/record-store.js'
      - 'sentlog/part05.txt'
      - 'tests/file_database_compat.test.cjs'
      - 'sentlog/session-guard.js'
      - 'tests/delta_*'
      - 'tests/record_file_guard*'
      - 'tests/session_guard.test.cjs'
      - 'tests/photo_redelivery_adversarial.test.cjs'
      - 'tests/delta_rejection_isolation.test.cjs'
      - 'sentlog/delta-sync-legacy-preflight.js'
      - 'tests/delta_legacy_preflight.test.cjs'
      - 'tests/photo_recovery_pc.test.cjs'
      - 'tests/collaboration_merge.test.cjs'
      - 'docs/sentlog-delta-*.md'
      - 'scripts/build_project_sync.py'
      - 'scripts/build_sync_traffic.py'
      - '.github/workflows/sentlog-delta-prototype.yml'
      - 'docs/sentlog-delta-v1-schema-prototype.sql'
      - 'docs/sentlog-delta-semantic-validation-prototype.sql'
      - 'docs/sentlog-delta-baseline-prototype.sql'
      - 'docs/sentlog-delta-transport-prototype.sql'
      - 'docs/sentlog-delta-atomic-groups-prototype.sql'
      - 'docs/sentlog-delta-archive-compat-prototype.sql'
      - 'db/archive_v1.sql'
      - 'sentlog/collaboration-channel.js'
      - 'tests/collaboration_channel.test.cjs'
      - 'tests/delta_schema_fixture.sql'
      - 'tests/delta_schema_assertions.sql'
      - 'tests/delta_schema_parallel.sh'
      - 'tests/delta_semantic_assertions.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delta-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and security invariants
        run: |
          node --check sentlog/delta-sync-core.js
          node --check sentlog/delta-sync-indexeddb.js
          node --check sentlog/photo-recovery.js
          node --check tests/delta_sync_protocol.test.cjs
          node --check sentlog/delta-sync-migration.js
          node --check sentlog/delta-sync-legacy-source.js
          node --check sentlog/delta-sync-assets.js
          node --check sentlog/delta-sync-reconcile.js
          node --check sentlog/delta-sync-bootstrap.js
          node --check sentlog/delta-sync-transport.js
          node --check sentlog/delta-sync-app-bridge.js
          node --check sentlog/delta-sync-asset-transport.js
          node --check sentlog/delta-sync-asset-runtime.js
          node --check sentlog/record-store.js
          node --check sentlog/session-guard.js
          python3 scripts/assemble_delta_sync.py --check
      - name: Install pinned in-memory IndexedDB test adapter
        run: npm install --prefix "$RUNNER_TEMP/sentlog-prototype-deps" --ignore-scripts --no-audit --no-fund --save-exact fake-indexeddb@6.2.8 @electric-sql/pglite@0.5.17
      - name: Offline, concurrency and idempotency scenarios
        run: |
          export NODE_PATH="$RUNNER_TEMP/sentlog-prototype-deps/node_modules"
          node tests/delta_sync_protocol.test.cjs
          node tests/delta_sync_adversarial.test.cjs
          node tests/delta_interleavings.test.cjs
          node tests/delta_rejection_isolation.test.cjs
          node tests/delta_legacy_preflight.test.cjs
          node tests/delta_legacy_source.test.cjs
          node tests/delta_migration.test.cjs
          node tests/delta_assets.test.cjs
          node tests/delta_seed.test.cjs
          node tests/delta_reconcile.test.cjs
          node tests/delta_bootstrap.test.cjs
          node tests/delta_fresh_archive_bootstrap.test.cjs
          node tests/delta_transport.test.cjs
          node tests/delta_checkpoint_retry.test.cjs
          node tests/delta_app_bridge.test.cjs
          node tests/delta_metadata.test.cjs
          node tests/delta_metadata_bridge.test.cjs
          node tests/delta_large_operations.test.cjs
          node tests/delta_app_journal.test.cjs
          BINDING_BENCHMARK=1 node tests/delta_cutoff_files.test.cjs
          node tests/delta_app_mode.test.cjs
          node tests/delta_photo_lease.test.cjs
          node tests/delta_capacity.test.cjs
          node tests/delta_capacity_gc.test.cjs
          node tests/delta_capacity_copies.test.cjs
          node tests/delta_projection_pglite.cjs
          node tests/delta_metadata_pglite.cjs
          node tests/delta_legacy_unicode_pglite.cjs
          node tests/delta_checkpoint_pglite.cjs
          node tests/delta_app_backend.test.cjs
          node tests/delta_release_pglite.cjs
          node tests/delta_receipt_cache_pglite.cjs
          node tests/delta_notify_noop_pglite.cjs
          node tests/delta_active_media_inventory_pglite.cjs
          node tests/recovery_queue.test.cjs
          node tests/delta_realtime_privileges.cjs
          node tests/delta_batch_paging.test.cjs
          node tests/delta_group_sync.test.cjs
          node tests/delta_group_contract.cjs
          node tests/delta_archive_pglite.cjs
          node tests/delta_asset_runtime.test.cjs
          node tests/record_file_guard.test.cjs
          node tests/file_database_compat.test.cjs
          node tests/session_guard.test.cjs
          node tests/collaboration_channel.test.cjs
          node tests/photo_redelivery_adversarial.test.cjs
      - name: Existing immutable record safety
        run: |
          node tests/record_collaboration.test.cjs

  browser-storage:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching package for the bundled browser engines
        timeout-minutes: 10
        run: python -m pip install playwright==1.64.1
      - name: Check real IndexedDB durability and offline restart
        timeout-minutes: 6
        run: python tests/delta_indexeddb_browser.py --browser ${{ matrix.browser }} --output release-diagnostics/delta-indexeddb-${{ matrix.browser }}.json
      - name: Verify photo bytes, atomic receipts and incomplete delivery
        timeout-minutes: 4
        run: python tests/delta_assets_browser.py --browser ${{ matrix.browser }} --output release-diagnostics/delta-assets-${{ matrix.browser }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-indexeddb-${{ matrix.browser }}
          path: release-diagnostics/

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: sentlog_delta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: sentlog_delta_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare isolated database
        run: psql -v ON_ERROR_STOP=1 -f tests/delta_schema_fixture.sql
      - name: Compile candidate delta schema
        run: psql -v ON_ERROR_STOP=1 -f docs/sentlog-delta-v1-schema-prototype.sql
      - name: Install record history semantic protection (prototype only)
        run: psql -v ON_ERROR_STOP=1 -f docs/sentlog-delta-semantic-validation-prototype.sql
      - name: Check RLS, sequence and retries
        run: psql -v ON_ERROR_STOP=1 -f tests/delta_schema_assertions.sql
      - name: Compare client and SQL payload validation on the same corpus
        shell: bash
        run: node tests/delta_payload_contract.cjs --sql | psql -X -v ON_ERROR_STOP=1
      - name: Reject malformed events and unsafe legacy writes
        run: psql -v ON_ERROR_STOP=1 -f tests/delta_schema_adversarial.sql
      - name: Reject missing record/parent, cyclic and rewritten histories
        run: psql -v ON_ERROR_STOP=1 -f tests/delta_semantic_assertions.sql
      - name: Stress test parallel commits and duplicate retries
        run: bash tests/delta_schema_parallel.sh
      - name: Check archive and device-stop races
        run: bash tests/delta_schema_lifecycle_races.sh
      - name: Prepare isolated legacy snapshot fixtures
        run: psql -v ON_ERROR_STOP=1 -f tests/delta_baseline_fixture.sql
      - name: Compile staged server baseline import (prototype only)
        run: psql -v ON_ERROR_STOP=1 -f docs/sentlog-delta-baseline-prototype.sql
      - name: Verify resumable baseline import and private activation guards
        run: psql -v ON_ERROR_STOP=1 -f tests/delta_baseline_assertions.sql
      - name: Check baseline activation against concurrent old saves and batch retries
        run: bash tests/delta_baseline_races.sh
      - name: Verify actual PostgreSQL baseline pages through JS reconciliation and SQL replay
        shell: bash
        run: psql -XqAt -v ON_ERROR_STOP=1 -f tests/delta_reconcile_sql_fixture.sql | node tests/delta_reconcile_sql_contract.cjs --stdin --sql | psql -X -v ON_ERROR_STOP=1
      - name: Prepare isolated Realtime policy fixtures
        run: psql -v ON_ERROR_STOP=1 -f tests/delta_transport_fixture.sql
      - name: Verify managed Realtime RLS without table-owner privileges
        shell: bash
        run: node tests/delta_realtime_privileges.cjs --sql | psql -X -v ON_ERROR_STOP=1
      - name: Compile authenticated bounded delta reads and private notification policies
        run: psql -v ON_ERROR_STOP=1 -f docs/sentlog-delta-transport-prototype.sql
      - name: Verify registered device, archive and private channel enforcement
        run: psql -v ON_ERROR_STOP=1 -f tests/delta_transport_assertions.sql
      - name: Compile atomic remote operation groups
        run: psql -v ON_ERROR_STOP=1 -f docs/sentlog-delta-atomic-groups-prototype.sql
      - name: Verify whole-group commit, identity, rollback and paging boundaries
        run: psql -v ON_ERROR_STOP=1 -f tests/delta_groups_assertions.sql
      - name: Prepare the actual legacy archive gateway in the isolated database
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/delta_archive_fixture.sql
          psql -v ON_ERROR_STOP=1 -f db/archive_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/delta_archive_setup.sql
      - name: Protect incomplete archive projections and existing archive jobs
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/sentlog-delta-archive-compat-prototype.sql
          psql -v ON_ERROR_STOP=1 -f tests/delta_archive_assertions.sql
      - name: Verify archive and grouped-edit races through separate connections
        run: bash tests/delta_archive_races.sh
      - name: Verify certified snapshot and real archive races through separate connections
        run: bash tests/delta_checkpoint_races.sh
