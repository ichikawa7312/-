name: Patch confirmation toggle

on:
  push:
    paths:
      - '.github/workflows/patch-confirm-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch confirmation toggle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          pattern = r"async function doConfirm\(id\)\{.*?\n\}\n\nasync function openPdf"
          replacement = (
              "async function doConfirm(id){\n"
              "  const s=schedules.find(x=>x.id===id);\n"
              "  const current=conf(s,me.id);\n"
              "  const confirmed=current&&current.revision>=s.revision;\n\n"
              "  if(confirmed){\n"
              "    const r=await db.from('confirmations').delete().eq('schedule_id',id).eq('staff_id',me.id);\n"
              "    if(r.error)return toast('確認を取り消せません');\n"
              "    await refresh();\n"
              "    return toast('確認を取り消しました');\n"
              "  }\n\n"
              "  const r=await db.from('confirmations').upsert(\n"
              "    {schedule_id:id,staff_id:me.id,revision:s.revision,confirmed_at:new Date().toISOString()},\n"
              "    {onConflict:'schedule_id,staff_id'}\n"
              "  );\n"
              "  if(r.error)return toast('保存できません');\n"
              "  await refresh();\n"
              "  toast('確認済みにしました');\n"
              "}\n\n"
              "async function openPdf"
          )
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'doConfirm patch count={count}')
          app.write_text(text, encoding='utf-8')

          index = Path('index.html')
          t = index.read_text(encoding='utf-8').replace('20260812-0945','20260812-1835')
          index.write_text(t, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8').replace('shinwa-yotei-v4','shinwa-yotei-v5').replace('20260812-0945','20260812-1835')
          sw.write_text(t, encoding='utf-8')
          PY
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/patch-confirm-toggle.yml
          git config user.name "ichikawa7312"
          git config user.email "ichikawa7312@gmail.com"
          git add app.js index.html sw.js .github/workflows/patch-confirm-toggle.yml
          git commit -m "Toggle schedule confirmation on repeated tap"
          git push
