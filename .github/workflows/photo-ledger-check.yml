name: Verify Sentlog high-quality photo ledger
on:
  pull_request:
    paths:
      - 'sentlog/photo-ledger*.js'
      - 'scripts/build_*ledger*.py'
      - 'scripts/build_original_photo_export.py'
      - 'scripts/assets/**'
      - 'tests/photo_ledger*'
      - 'tests/high_quality_ledger_ui.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/photo-ledger-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the exact production application and all regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/pages.yml').read_text().splitlines()
          marker='      - name: Build archive, management and capacity integration'
          assert lines.count(marker)==1
          commands=[]
          for line in lines[lines.index(marker)+2:]:
              if not line.startswith('          '):break
              commands.append(line[10:])
          assert any('build_original_photo_export.py' in c for c in commands)
          subprocess.run(['bash','-e','-o','pipefail','-c','\n'.join(commands)],check=True)
          assert '20261125-ledger-hq-1' in Path('sentlog/index.html').read_text()
          assert 'photo-ledger-stream.js' in Path('sentlog/sw.js').read_text()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-production-build
          path: |
            sentlog/
            tests/
          retention-days: 7
  browser:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            engine: chromium
            width: 1280
            phase: large
          - os: ubuntu-24.04
            engine: chromium
            width: 1280
            phase: recovery
          - os: macos-15-intel
            engine: webkit
            width: 390
            phase: large
          - os: macos-15-intel
            engine: webkit
            width: 820
            phase: recovery
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ledger-production-build
          path: .
      - name: Install pinned browser and workbook readers
        run: |
          python -m pip install playwright==1.57.0 pillow==11.3.0 openpyxl==3.1.5
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Test high-quality output, capacity, recovery and old/new comparison
        env:
          BASE_REF: c173715d9fc0b3fa4043894aebc4f3ac9ab8ce19
        run: python -u tests/high_quality_ledger_ui.py --engine ${{ matrix.engine }} --width ${{ matrix.width }} --phase ${{ matrix.phase }} --base "$BASE_REF"
      - name: Test existing full application photo-ledger UI and four formats
        if: matrix.phase == 'recovery'
        env:
          SENTLOG_TEST_BROWSER: ${{ matrix.engine }}
          SENTLOG_TEST_WIDTH: ${{ matrix.width }}
        run: python -u tests/photo_ledger_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-diagnostics-${{ matrix.engine }}-${{ matrix.phase }}
          path: ledger-diagnostics/
          retention-days: 14
