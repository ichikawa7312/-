name: Patch field headcount

on:
  push:
    paths:
      - '.github/workflows/patch-field-headcount.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply field headcount patch
        run: python .github/patch-field-headcount.py
      - name: Check JavaScript
        run: node --check app.js
      - name: Commit changes
        run: |
          git config user.name "ichikawa7312"
          git config user.email "ichikawa7312@gmail.com"
          git add app.js app.css index.html sw.js
          git commit -m "Show field headcount on two-week board"
          git push
