name: Deploy Shinwa Yotei to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build archive, management and capacity integration
        run: |
          python3 scripts/build_archive.py
          python3 scripts/build_management.py
          python3 scripts/build_capacity.py
          python3 scripts/build_resilience.py
          python3 scripts/build_photo_recovery.py
          python3 scripts/build_shape_move.py
          python3 scripts/build_instant_damage_type.py
          python3 scripts/build_compact_labels.py
          python3 scripts/build_overview_labels.py
          python3 scripts/build_polygon_snap.py
          python3 scripts/build_polygon_dimensions.py
          python3 scripts/build_damage_catalog.py
          python3 scripts/build_toolbar_icons.py
          python3 scripts/build_toolbar_help.py
          python3 scripts/build_damage_styles.py
          python3 scripts/build_label_colors.py
          python3 scripts/build_plain_numbers.py
          python3 scripts/build_single_number_ui.py
          python3 scripts/build_optional_symbol_ui.py
          python3 scripts/build_image_recovery_view.py
          python3 scripts/build_large_image_view.py
          python3 scripts/build_image_memory.py
          python3 scripts/build_image_viewport.py
          python3 scripts/build_original_photos.py
          python3 scripts/build_crack_width.py
          node tests/image_recovery_view.test.cjs
          node --check sentlog/original-photo-store.js
          node --check sentlog/crack-width.js
          node tests/large_image_view.test.cjs
          node tests/original_photo_store.test.cjs
          node tests/crack_width.test.cjs
          node tests/core.test.cjs
          node tests/pc.test.cjs
          node tests/integration.test.cjs
          node tests/management.test.cjs
          node tests/capacity.test.cjs
          node tests/capacity_pc.test.cjs
          node tests/resilience.test.cjs
          node tests/resilience_pc.test.cjs
          node tests/photo_recovery_pc.test.cjs
          node tests/photo_delivery_guard.test.cjs
          node tests/leader_line_width.test.cjs
          node tests/shape_move.test.cjs
          node tests/instant_damage_type.test.cjs
          node tests/compact_labels.test.cjs
          node tests/polygon_snap.test.cjs
          node tests/polygon_dimensions.test.cjs
          node tests/damage_catalog.test.cjs
          node tests/toolbar_icons.test.cjs
          node tests/toolbar_help.test.cjs
          node tests/damage_styles.test.cjs
          node tests/label_colors.test.cjs
          node tests/plain_numbers.test.cjs
          node tests/single_number_ui.test.cjs
          node tests/optional_symbol_ui.test.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
