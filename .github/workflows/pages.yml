name: Deploy Shinwa Yotei to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build archive, management and capacity integration
        run: |
          python3 scripts/build_archive.py
          python3 scripts/build_management.py
          python3 scripts/build_capacity.py
          python3 scripts/build_resilience.py
          node tests/core.test.cjs
          node tests/pc.test.cjs
          node tests/integration.test.cjs
          node tests/management.test.cjs
          node tests/capacity.test.cjs
          node tests/capacity_pc.test.cjs
          node tests/resilience.test.cjs
          node tests/resilience_pc.test.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
