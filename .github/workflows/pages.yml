      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify Pages artifact readiness checks
        run: python3 tests/pages_artifact_readiness_test.py
      - name: Upload artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
          name: ${{ env.SENTLOG_PAGES_ARTIFACT_NAME }}
      - name: Wait for the exact uploaded Pages artifact
        env:
          SENTLOG_PAGES_TOKEN: ${{ github.token }}
          SENTLOG_PAGES_REPOSITORY: ${{ github.repository }}
          SENTLOG_PAGES_RUN_ID: ${{ github.run_id }}
          SENTLOG_PAGES_RUN_ATTEMPT: ${{ github.run_attempt }}
          SENTLOG_PAGES_HEAD_SHA: ${{ github.sha }}
          SENTLOG_PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: python3 scripts/wait_pages_artifact.py
      - name: Confirm Pages artifact is downloadable by name
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SENTLOG_PAGES_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/sentlog-pages-artifact-probe
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.SENTLOG_PAGES_ARTIFACT_NAME }}
      - name: Verify published collaboration resources
        env:
          SENTLOG_DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import sha256
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          import os,time
          names=['index.html','sw.js','record-collaboration.js','collaboration-editor.js',
                 'collaboration-channel.js','collaboration-photos.js','continuous-camera.js','cloud-sync.js',
                 'photo-display-order.js','camera-return.js','phone-runtime.js',
                 'sync-merge.js','sync-view.js','original-photo-store.js',
                 'original-photo-export.js','original-photo-export-worker.js','original-photo-zip.js','record-transfer.js',
                 'photo-ledger.js','photo-ledger-visual3.js','photo-viewer.js',
                 'pdf-quality.js','image-quality.js','field-records.js','page-management.js','drawing-export-view.html']
          names+=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt',
                  'part06.txt','part07.txt','part08.txt','part09.txt']
          names+=['storage-check.html','startup-storage-diagnostics.js',
                  'record-store.js','record-rescue.js','photo-recovery.js','blob-sha256.js','storage-ui.js','storage-diagnostics.js','storage-diagnostics-ui.js',
                  'pdf-recovery.js','archive.js','archive-core.js','archive-capacity.js',
                  'delta-sync-core.js','delta-sync-indexeddb.js','delta-sync-legacy-preflight.js',
                  'delta-sync-legacy-source.js','delta-sync-migration.js','delta-sync-metadata.js',
                  'delta-sync-reconcile.js','delta-sync-bootstrap.js','delta-sync-transport.js',
                  'delta-sync-app-bridge.js','delta-sync-assets.js','delta-sync-asset-transport.js',
                  'delta-sync-asset-runtime.js','delta-sync-app-journal.js','delta-sync-app-migration.js','delta-sync-migration-recovery.js',
                  'delta-sync-app-runtime.js','delta-sync-metadata-ui.js','delta-sync-capacity.js','delta-sync-capacity-gc.js',
                  'delta-sync-drawing-review.js','sync-status.js','sync-work-status.js']
          base=os.environ['SENTLOG_DEPLOYMENT_URL'].rstrip('/')+'/'
          assert base.startswith('https://')
          def verify(name):
              expected=sha256((Path('sentlog')/name).read_bytes()).hexdigest()
              url=urljoin(base,'sentlog/'+name)+'?release-check='+expected[:16]
              for attempt in range(10):
                  try:
                      request=Request(url,headers={'Cache-Control':'no-cache'})
                      with urlopen(request,timeout=15) as response:
                          actual=sha256(response.read(4_000_000)).hexdigest()
                      if actual==expected:return name
                  except Exception:
                      pass
                  if attempt<9:time.sleep(3)
              raise RuntimeError('Published resource differs from the tested build: '+name)
          with ThreadPoolExecutor(max_workers=4) as pool:
              checked=list(pool.map(verify,names))
          print('PASS published collaboration resources: '+str(len(checked))+' exact SHA-256 matches')
          PY
